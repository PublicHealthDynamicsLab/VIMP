<html>
<head>
    <!--LINK JQUERY-->
    <link rel="stylesheet" href="server_front.css">

    <title>
       Public Health Messaging
    </title>
</head>
<body>
    <div id="topbar">
        <div class = "label" id="details">
            <p>Details</p>
             <textarea id="prompt"></textarea></div>
        <div class = "label" id = "vaccine">
            <p>Vaccine
                (Select 1)
            </p>
            <button class="vac-button" id="covid">COVID-19</button>
            <button class="vac-button" id="flu">Flu</button>
            <button class="vac-button" id="rsvyoung">RSV (50-74)</button>
            <button class="vac-button" id="rsvold">RSV (75+)</button>
        </div>
    </div>
    <div id="filters">
        <div id="selector">
            <p class ="label">Target 
                Demos
            </p>
        </div>
        <div class = "dropdowns" id="age">
            <button id="drop-age">Age</button>
            <div>
            
            <input type="checkbox" id="young-age">
            <label for="young-age">18-49 years</label>
            </div>
            <div>
            <input type="checkbox" id="middle-age">
            <label for="young-age">50-64 years</label>
            </div>
            <div>
            <input type="checkbox" id="old-age">
            <label for="young-age">65+ years</label>
            </div>
        </div>

        <div class = "dropdowns" id="svi">
            <button id="drop-svi">Social Vulnerability Index</button>
            
        </div>

        <div class = "dropdowns" id="svi">
            <button id="drop-insurance">Insurance Status</button>
            
        </div>
    </div>
    <div id = "gens">
        <button id="generate-button">Generate message</button>
        <div id = "generations">
            <p id="generationed-text">
                Friendly reminder to those 18-49 that you too can get and spread COVID! COVID may seem like just a cold now, but has been associated with cardiac health complications even after you’ve fully recovered. Protect your future now and get vaccinated 💉
            </p>
            <div id="gen-buttons">
                <button>Get Explanation</button>
                <button>Translate</button>
            </div>
        </div>
    </div>

</body>
